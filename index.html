<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="精選好物推薦，快速搜尋商品並前往蝦皮查看最新資訊。">
  <title>好物推薦｜精選購物清單</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">🛍️ 好物推薦</div>
      <p class="eyebrow">精選好物・輕鬆挑選</p>
      <h1>找到你正在尋找的好物</h1>
      <p class="subtitle">搜尋商品、瀏覽分類，點擊按鈕前往蝦皮查看商品詳情。</p>
      <label class="search-wrap">
        <span aria-hidden="true">🔎</span>
        <input id="searchInput" type="search" placeholder="搜尋商品名稱或商店…" autocomplete="off">
      </label>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="商品篩選">
      <div>
        <h2>精選商品</h2>
        <p id="resultCount" class="muted">正在載入商品…</p>
      </div>
      <select id="sortSelect" aria-label="商品排序">
        <option value="default">預設排序</option>
        <option value="sales">銷售量由高到低</option>
        <option value="name">商品名稱 A–Z</option>
      </select>
    </section>

    <nav id="categoryList" class="categories" aria-label="商品分類"></nav>
    <section id="productGrid" class="product-grid" aria-live="polite"></section>
    <p id="emptyState" class="empty-state" hidden>找不到符合條件的商品，請換個關鍵字或分類。</p>
    <div class="load-row"><button id="loadMore" class="load-more" type="button">顯示更多商品</button></div>
  </main>

  <footer>
    <p>商品價格、庫存及優惠以蝦皮商品頁面顯示為準。</p>
    <p>本網站為商品推薦頁面，點擊「立即查看」將前往蝦皮。</p>
  </footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
