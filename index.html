<style>
  :root {
    --primary: #ee4d2d;
    --bg: #f5f5f5;
    --card: #fff;
    --text: #222;
    --muted: #888;
    --thumb-bg: #fff0ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 24px;
  }

  /* 分類標籤 */
  .tabs {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    background: var(--bg);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 10px 22px;
    border-radius: 999px;
    border: none;
    background: #fff;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
  }
  .tab.active { background: var(--primary); color: #fff; font-weight: 600; }

  .count { padding: 4px 16px 12px; font-size: 14px; color: var(--muted); }

  /* 商品格線 */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 14px;
  }
  @media (min-width: 720px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr); max-width: 1200px; margin: 0 auto; } }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 12px;
    display: flex; flex-direction: column;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .thumb {
    aspect-ratio: 1 / 0.63;
    border-radius: 12px;
    background: var(--thumb-bg);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .ph { font-size: 44px; }

  .cat { margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--primary); }
  .title {
    margin-top: 6px;
    font-size: 15px; font-weight: 700; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: calc(1.45em * 4);
  }
  .price { margin-top: 8px; font-size: 24px; font-weight: 800; color: var(--primary); }
  .meta { margin-top: 6px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .meta .sku { color: #aaa; }

  .actions { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .btn {
    display: block; text-align: center; text-decoration: none;
    padding: 11px 0; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn.ghost { border: 1px solid #ddd; background: #fff; color: var(--text); }
  .btn.solid { border: 1px solid var(--primary); background: var(--primary); color: #fff; }
  .btn:active { opacity: .8; }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>

  // ====== 狀態 ======
  const ALL = "全部商品";
  let current = ALL;

  const $tabs = document.getElementById("tabs");
  const $grid = document.getElementById("grid");
  const $count = document.getElementById("count");

  const fmt = n => "NT$ " + Number(n).toLocaleString("en-US");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  // 依商品編號去重
  function dedupe(list) {
    const seen = new Set();
    return list.filter(p => !seen.has(p.id) && seen.add(p.id));
  }

  function renderTabs() {
    const cats = [ALL, ...new Set(products.map(p => p.category))];
    $tabs.innerHTML = cats.map(c =>
      `<button class="tab ${c === current ? "active" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`
    ).join("");
  }

  function renderGrid() {
    const list = dedupe(products).filter(p => current === ALL || p.category === current);
    $count.textContent = `共 ${list.length} 件商品（已依商品編號去重；不顯示分潤資料）`;

    if (!list.length) { $grid.innerHTML = `<div class="empty">目前沒有商品</div>`; return; }

    $grid.innerHTML = list.map(p => `
      <article class="card">
        <div class="thumb">
          ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">` : `<span class="ph">${p.category === "美妝保養" ? "🧴" : "🍜"}</span>`}
        </div>
        <div class="cat">${esc(p.category)}</div>
        <h3 class="title">${esc(p.title)}</h3>
        <div class="price">${fmt(p.price)}</div>
        <div class="meta">
          商店：${esc(p.store)} ｜ 銷量：${esc(p.sales)}
          <div class="sku">商品編號：${esc(p.id)}</div>
        </div>
        <div class="actions">
          <a class="btn ghost" href="${esc(p.viewUrl)}" target="_blank" rel="noopener">查看商品</a>
          <a class="btn solid" href="${esc(p.buyUrl)}" target="_blank" rel="noopener">前往購買</a>
        </div>
      </article>
    `).join("");
  }

  $tabs.addEventListener("click", e => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    current = btn.dataset.cat;
    renderTabs();
    renderGrid();
  });

  renderTabs();
  renderGrid();
</script>
